<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <p class="summary" id="summary"></p>
    </header>

    <form id="add-form" class="add-form">
      <input id="item-input" type="text" placeholder="살 물건을 입력하세요" autocomplete="off" maxlength="100" />
      <button type="submit">추가</button>
    </form>

    <p id="status" class="status" role="status" hidden></p>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">아직 아이템이 없어요. 위에서 추가해 보세요!</p>

    <button id="clear-done" class="clear-done" type="button">구매 완료 항목 지우기</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
